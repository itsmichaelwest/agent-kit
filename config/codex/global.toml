# Portable Codex settings. Machine-local runtime state stays outside the
# Agent Kit managed block in ~/.codex/config.toml.
#:schema https://developers.openai.com/codex/config-schema.json
personality = "pragmatic"
sandbox_mode = "danger-full-access"
web_search = "live"

[features]
memories = true
multi_agent = true

[memories]
generate_memories = true
use_memories = true

[shell_environment_policy]
inherit = "core"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit"]

[agents]
max_threads = 16
