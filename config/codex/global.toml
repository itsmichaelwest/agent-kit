# Portable Codex settings. Only the leaf keys listed here are synced.
# Other keys in ~/.codex/config.toml remain machine-local.
# Manage permissions locally in Codex rather than syncing a global policy.
#:schema https://developers.openai.com/codex/config-schema.json
personality = "pragmatic"
web_search = "live"

[features]
memories = true
multi_agent = true

[memories]
generate_memories = true
use_memories = true

[shell_environment_policy]
inherit = "core"

[tui]
status_line = ["model-with-reasoning", "context-remaining", "current-dir", "git-branch", "five-hour-limit"]

[agents]
max_threads = 16
